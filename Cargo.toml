[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
spring = { package = "spring-sdk", git = "https://github.com/gajop/spring-rust", rev = "0f0ee80fa0ee620bc2988c64559feb3cbd163e10" }
spring-addons = { package = "spring-addons", git = "https://github.com/gajop/spring-rust", rev = "0f0ee80fa0ee620bc2988c64559feb3cbd163e10" }
springcabal = { path = "crates/springcabal" }
# `core` has no exp/atan2 on a no_std target.
libm = "0.2"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
too_many_arguments = "allow"
