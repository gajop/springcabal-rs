[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
spring = { package = "spring-sdk", path = "../../../spring-sdk-unified/rust/crates/spring-sdk" }
spring-addons = { path = "../../../spring-sdk-unified/rust/crates/spring-addons" }
springcabal = { path = "crates/springcabal" }
# `core` has no exp/atan2 on a no_std target.
libm = "0.2"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
too_many_arguments = "allow"
